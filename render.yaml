services:
  - type: web
    name: sbtechinfo-nid-ocr-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://sbtechinfo.liveblog365.com
      - key: OCR_LANG
        value: ben+eng
      - key: OCR_SCALE
        value: "3.2"
      - key: MAX_PDF_BYTES
        value: "15728640"
      - key: MAX_CONCURRENT_EXTRACTS
        value: "1"
      - key: EXTRACT_TIMEOUT_SECONDS
        value: "120"
